name: generate readme

permissions:
    contents: write

on:
    schedule:
        - cron: "0 */6 * * *" # every 6 hours
    workflow_dispatch:

jobs:
    download-svg:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "20.x"

            - name: Generate Monkeytype card
              env:
                  MT_USER: FrankensteinRjR
              run: node scripts/monkeytype-card.mjs

            - name: Publish generated assets
              uses: crazy-max/ghaction-github-pages@v4.0.0
              with:
                  target_branch: monkeytype-readme
                  build_dir: public
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
